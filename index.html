<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU AWAL -->
    <div id="menu" class="screen">
        <div class="card">
            <div class="logo">🧩</div>
            <h1>MAZE CHALLENGE</h1>
            <p class="subtitle">Seberapa cepat kamu bisa keluar?</p>

            <input 
                type="text" 
                id="username" 
                placeholder="Masukkan Username"
                maxlength="20"
            >

            <input 
                type="tel" 
                id="whatsapp" 
                placeholder="Nomor WhatsApp"
                maxlength="15"
            >

            <button id="startBtn" class="main-btn">
                ▶ MULAI BERMAIN
            </button>

            <button id="leaderboardBtn" class="secondary-btn">
                🏆 LEADERBOARD
            </button>

            <p id="error"></p>
        </div>
    </div>

    <!-- GAME -->
    <div id="gameScreen" class="screen hidden">

        <header class="game-header">
            <div>
                <span>Pemain</span>
                <strong id="playerName">-</strong>
            </div>

            <div class="timer-box">
                ⏱️ <span id="timer">00:00.00</span>
            </div>
        </header>

        <main class="game-container">

            <div class="maze-wrapper">
                <canvas id="mazeCanvas"></canvas>
            </div>

            <p class="instruction">
                🟢 Mulai &nbsp; • &nbsp; 🔴 Keluar
            </p>

            <!-- KONTROL HP -->
            <div class="controls">

                <button class="control empty"></button>

                <button class="control" data-dir="up">
                    ▲
                </button>

                <button class="control empty"></button>

                <button class="control" data-dir="left">
                    ◀
                </button>

                <button class="control" data-dir="down">
                    ▼
                </button>

                <button class="control" data-dir="right">
                    ▶
                </button>

            </div>

            <button id="quitBtn" class="quit-btn">
                ✕ Keluar Game
            </button>

        </main>
    </div>

    <!-- HASIL -->
    <div id="resultScreen" class="screen hidden">
        <div class="card result-card">

            <div class="trophy">🏆</div>

            <h1>LABIRIN SELESAI!</h1>

            <p>Selamat, <strong id="resultName"></strong>!</p>

            <div class="result-time">
                <span>Waktu Kamu</span>
                <strong id="finalTime">00:00.00</strong>
            </div>

            <p id="saveStatus">
                Menyimpan skor...
            </p>

            <button id="playAgainBtn" class="main-btn">
                🔄 MAIN LAGI
            </button>

            <button id="resultLeaderboardBtn" class="secondary-btn">
                🏆 LEADERBOARD
            </button>

        </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboardScreen" class="screen hidden">

        <div class="leaderboard-card">

            <div class="leaderboard-title">
                <span>🏆</span>
                <h1>LEADERBOARD</h1>
            </div>

            <p class="small-text">
                Waktu tercepat berada di posisi teratas
            </p>

            <div id="leaderboardList">
                <div class="loading">
                    Memuat leaderboard...
                </div>
            </div>

            <button id="backBtn" class="secondary-btn">
                ← KEMBALI
            </button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
